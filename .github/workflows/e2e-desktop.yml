name: Desktop E2E (pywinauto smoke)

# Mirrors the existing windows.yml trigger design: this repo's
# workflows run on pushes to master and on manual dispatch, not on
# pull requests. The job builds and packages the app exactly like
# windows.yml, then runs the e2e/ smoke suite against the staged
# portable folder on the same runner class.
on:
  push:
    branches: [master, revival/qt6-stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision pinned dependencies
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.4
          python -m pip install -r e2e/requirements.txt
          python tools/fetch_qt.py --output .deps/Qt
          git clone https://git.code.sf.net/p/qwt/git .deps/qwt
          git -C .deps/qwt checkout 4ddf2f3878d0835f678da0f2aba1180f2ba208f6

      - name: Build and package
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vc = (Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Include" -Directory | Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1).Name
          $tools = Split-Path (Get-Command cmake.exe).Source
          python tools/build_windows.py --qt-root .deps/Qt/6.12.0/msvc2022_64 --qwt-source .deps/qwt --msvc-root "$vc" --sdk-version "$sdk" --tools-dir "$tools" --build-root build-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $crt = (Get-ChildItem "$vs/VC/Redist/MSVC" -Directory | Where-Object Name -Match '^14\.' | Sort-Object Name -Descending | Select-Object -First 1).FullName + '/x64/Microsoft.VC143.CRT'
          python tools/package_windows.py --build-root build-release --qt-root .deps/Qt/6.12.0/msvc2022_64 --crt-root "$crt" --qt-source .deps/Qt/qtbase-everywhere-src-6.12.0.tar.xz --output staging
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run desktop E2E smoke tests
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem staging -Directory | Where-Object Name -Like 'DiffImg-*-win-x64' | Select-Object -First 1).FullName
          if (-not $pkg) { throw 'Packaged DiffImg folder not found under staging/' }
          $env:DIFFIMG_APP_DIR = $pkg
          python -m pytest e2e -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore
